<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta name="description" content="Pentarchy — private members' storefront." />
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:title" content="Pentarchy" />
    <meta property="og:site_name" content="Pentarchy" />
    <meta property="og:description" content="Private members' storefront." />
    <meta name="twitter:title" content="Pentarchy" />
    <meta name="theme-color" content="#121214" />
    <meta name="color-scheme" content="dark" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #121214;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run Pentarchy.</noscript>
    <div id="root"><div id="boot" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#121214;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"><div style="color:#fff;font-size:28px;font-weight:600;letter-spacing:6px">PENTARCHY<span style="color:#2563EB">.</span></div><div style="color:#8E8E93;font-size:13px;letter-spacing:2px;margin-top:10px">VIAL</div></div></div>
    <script>
      if ("serviceWorker" in navigator) {
        // Remove any service worker left on this origin by the old GLP app
        // (anything that isn't our /sw.js), then register the Pentarchy shell SW.
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) {
            var url = (r.active || r.waiting || r.installing || {}).scriptURL || "";
            if (!/\/sw\.js(\?|$)/.test(url)) {
              r.unregister();
              if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { if (k.indexOf("pentarchy-shell-") !== 0) caches.delete(k); }); });
            }
          });
        }).catch(function () {});
      }
      // Shell-only service worker (never caches API / account / order / label data).
      if ("serviceWorker" in navigator && location.protocol === "https:" && !/[?&]nosw\b/.test(location.search)) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js", { scope: "/" }).catch(function () {});
        });
      }
    </script>
  </body>
</html>
